org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 1. Disable Kotlin incremental compilation to fix "Storage is already registered" daemon crash
kotlin.incremental=false

# 2. Run Kotlin compiler in-process to avoid spawning an unstable secondary Kotlin daemon
kotlin.compiler.execution.strategy=in-process

# 3. Disable parallel task execution to prevent Windows file-locking race conditions in mergeReleaseResources
org.gradle.parallel=false

# 4. Disable Gradle build output caching to avoid occupying C drive
org.gradle.caching=false

# 5. Disable background Gradle daemon processes and file system watching to save memory & disk
org.gradle.daemon=false
org.gradle.vfs.watch=false
